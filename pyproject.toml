[project]
name = "patron-staffing"
version = "1.0.0"
description = "Patron Staffing backend API"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "sqlalchemy>=2.0.45",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "python-multipart>=0.0.27",
    "greenlet>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
